# TEMPORÁRIO: acha qual teste do assistente de impressora derruba o Tk no Linux (segfault). Será removido.
name: Diagnostico Tk (temporario)
on:
  workflow_dispatch:
  push:
    branches: ["claude/fervent-rubin-v4gl3j"]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        diag:
          - ""
          - "nocent"
          - "notrans"
          - "nobind"
          - "noatualizar"
          - "nocent notrans"
          - "nocent notrans nobind noatualizar"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r backend/requirements.txt httpx
      - env:
          DIAG_TK: ${{ matrix.diag }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb python3-tk
          xvfb-run -a -s "-screen 0 1920x1080x24" python -X faulthandler -m unittest tests.test_ui.TesteSeletorDeImpressoras -k test_assistente_sem -k test_cozinha -v
